name: Fork hybrid state checks

on:
  pull_request:
    branches: [main, baseline/electron-v43.7.0-c440db5]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  state:
    if: >-
      github.repository == 'rossf/electron' &&
      github.event.pull_request.head.repo.full_name == 'rossf/electron' &&
      (github.head_ref == 'experimental/linux-phone-passkey-preservation' ||
       github.head_ref == 'experimental/linux-phone-passkey-main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Check the exact base-to-head diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git fetch --no-tags --depth=1 https://github.com/rossf/electron.git "$BASE_SHA"
          git diff --check "$BASE_SHA" "$HEAD_SHA"
      - name: Compile and run the standalone lifetime-policy test
        run: python3 script/run-webauthn-hybrid-tests.py --suite state
